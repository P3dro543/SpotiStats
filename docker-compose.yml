services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spotify_stats
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify -d spotify_stats"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      API_PORT: 3001
      WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://spotify:spotify@postgres:5432/spotify_stats?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
